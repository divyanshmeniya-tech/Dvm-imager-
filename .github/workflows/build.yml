name: Build DVM Imager APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Project and Build APK
        run: |
          SETTINGS=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Error: settings.gradle or settings.gradle.kts not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "Found project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk
          
